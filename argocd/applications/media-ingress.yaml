apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-ingress
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/RepTambe/k8shome.git
    path: apps/media-ingress
    targetRevision: main
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
