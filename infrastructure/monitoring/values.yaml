# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Grafana configuration
grafana:
  enabled: true
  adminPassword: "admin"  # Change this!
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  
  # Ingress for Grafana UI
  ingress:
    enabled: true
    hosts:
      - grafana.homelab.local
    path: /
    pathType: Prefix

# AlertManager configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Node exporter - collects node metrics
prometheus-node-exporter:
  enabled: true

# Kube-state-metrics - k8s object metrics
kube-state-metrics:
  enabled: true
